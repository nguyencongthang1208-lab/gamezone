
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giới thiệu - GameZone</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a href="index.html" class="logo">🎮 GameZone</a>
  <nav>
    <a href="index.html">Trang chủ</a>
    <a href="games.html">Danh sách game</a>
    <a href="downloads.html">Tải game</a>
    <a href="about.html">Liên hệ</a>
  </nav>
</header>

<main class="container">
  <h1 class="page-title">Giới thiệu GameZone</h1>

  <div class="content-box">
    <h2>Chúng tôi là ai?</h2>
    <p>
      GameZone là website giới thiệu game, cung cấp thông tin
      về thể loại, cấu hình và nguồn tải game chính thức.
    </p>
  </div>

  <div class="content-box">
    <h2>Liên hệ với chúng tôi</h2>

    <form id="contactForm">
      <label for="name">Họ và tên</label>
      <input id="name" required placeholder="Nhập họ tên">

      <label for="email">Email</label>
      <input id="email" type="email" required
             placeholder="Nhập email">

      <label for="message">Nội dung góp ý</label>
      <textarea id="message" rows="5" required
                placeholder="Nhập nội dung..."></textarea>

      <button class="btn" type="submit">Gửi góp ý</button>
    </form>

    <p id="formStatus" role="status"></p>
  </div>
</main>

<footer>© 2026 GameZone</footer>
<script src="script.js"></script>
</body>
</html>
